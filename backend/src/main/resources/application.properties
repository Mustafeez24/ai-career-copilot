spring.application.name=ai-career-copilot
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/career_copilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:YWktY2FyZWVyLWNvcGlsb3QtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

integrations.serpapi.key=${SERPAPI_KEY:}
integrations.nvidia.key=${NVIDIA_API_KEY:}
integrations.nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never