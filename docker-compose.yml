services:
  db:
    image: postgres:16-alpine
    container_name: ai-career-copilot-db
    environment:
      POSTGRES_DB: career_copilot
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - career_copilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-career-copilot-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/career_copilot
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-YWktY2FyZWVyLWNvcGlsb3QtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  career_copilot_data: