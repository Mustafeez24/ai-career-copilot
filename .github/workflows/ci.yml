name: AI Career Copilot CI

on:
  push:
    branches:
      - main
      - feat/ai-career-copilot-spring-backend
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Spring Boot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Validate Spring Boot backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
